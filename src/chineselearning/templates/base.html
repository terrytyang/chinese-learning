<!doctype html>
{# htmx 2.0.4 (static/htmx.min.js); 422 responses are swapped so a form shows its validation message in place. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Chinese Learning</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
  {% block nav %}<nav><a href="/texts">Texts</a> <a href="/learn">Learn</a></nav>{% endblock %}
  <main>
  {% block content %}{% endblock %}
  </main>
</body>
</html>
