# Terminal route, no VS Code: same image as the Dev Container.
#   docker compose build dev
#   docker compose run --rm dev            # shell
#   docker compose run --rm dev claude     # Claude Code
#   docker compose run --rm -T dev uv run --locked pytest -q
# One-time on a new Docker host: docker volume create chineselearning-claude-state
name: chineselearning

services:
  dev:
    image: chineselearning-dev:local
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    user: node
    working_dir: /workspaces/chineselearning
    init: true
    stdin_open: true
    tty: true
    environment:
      UV_LINK_MODE: copy
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: ["/usr/local/bin/chineselearning-entrypoint"]
    command: ["bash"]
    volumes:
      - type: bind
        source: .
        target: /workspaces/chineselearning
      - type: bind
        source: ./hsk-original
        target: /workspaces/chineselearning/hsk-original
        read_only: true
      - python_env:/workspaces/chineselearning/.venv
      - uv_cache:/home/node/.cache/uv
      - claude_state:/home/node/.claude

volumes:
  python_env:
  uv_cache:
  claude_state:
    # Shared with the VS Code Dev Container so one login serves both routes.
    external: true
    name: chineselearning-claude-state
