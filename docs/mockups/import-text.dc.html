<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import a text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f6f5f2;color:#1f1f1d;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
.zh{font-family:"Noto Serif SC","Songti SC",serif}
button{font:inherit;cursor:pointer;border:1px solid #cfccc5;background:#fff;color:#1f1f1d;border-radius:6px;padding:4px 10px;min-height:28px}
button.primary{background:#1f1f1d;color:#fff;border-color:#1f1f1d}
input,select,textarea{font:inherit;border:1px solid #cfccc5;border-radius:6px;padding:6px 8px;background:#fff}
.card{background:#fff;border:1px solid #e3e1dc;border-radius:10px;padding:16px 18px}
.muted{color:#6b6b66}
.nav a{margin-right:16px;color:#6b6b66;text-decoration:none}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#6b6b66}
</style>
</helmet>
<div style="max-width: 820px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 20px">
  <div class="nav"><a href="#texts">Texts</a><a href="#learn">Learn</a><a href="dictionary-page.dc.html">Dictionary</a></div>
  <h1 style="margin: 0; font-size: 24px; font-weight: 600">Import a text</h1>
  <p class="muted" style="margin: 0">Writes <code>data/texts/&lt;next id&gt;-&lt;title&gt;.md</code>, rebuilds, runs intake, and opens the text's admin page. The file is the source; edit it there afterwards if needed.</p>
  <div class="card" style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <label>Title <input class="zh" value="{{title}}" onChange="{{setTitle}}" placeholder="静夜思"></label>
      <label>Author <input class="zh" value="{{author}}" onChange="{{setAuthor}}" placeholder="李白"></label>
      <label>Period <input class="zh" value="{{period}}" onChange="{{setPeriod}}" placeholder="唐朝"></label>
    </div>
    <label>Tags <input class="zh" value="{{tags}}" onChange="{{setTags}}" placeholder="诗词, 节选 — comma separated; new names are created"></label>
    <label>Body <textarea class="zh" rows="8" style="font-size: 18px; line-height: 1.8" onChange="{{setBody}}" placeholder="床前明月光，疑是地上霜。&#10;举头望明月，低头思故乡。">{{body}}</textarea></label>
    <div style="display: flex; gap: 10px; align-items: center">
      <button class="primary" onClick="{{submit}}">Import and open</button>
      <span class="muted">{{status}}</span>
    </div>
  </div>
  <div class="card">
    <div style="font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #6b6b66; margin-bottom: 8px">Will be written as</div>
    <pre class="zh" style="margin: 0; white-space: pre-wrap; font-size: 14px">{{preview}}</pre>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { title: '', author: '', period: '', tags: '诗词', body: '', status: '' }; }
  renderVals() {
    const s = this.state;
    const head = ['id: 6', 'title: ' + (s.title || '…'), s.author ? 'author: ' + s.author : null, s.period ? 'period: ' + s.period : null, 'tags: ' + (s.tags || '…')].filter(Boolean).join('\n');
    return {
      ...s,
      setTitle: e => this.setState({ title: e.target.value }), setAuthor: e => this.setState({ author: e.target.value }),
      setPeriod: e => this.setState({ period: e.target.value }), setTags: e => this.setState({ tags: e.target.value }),
      setBody: e => this.setState({ body: e.target.value }),
      preview: head + '\n\n' + (s.body || '…'),
      submit: () => this.setState({ status: s.title && s.body && s.tags ? 'Written data/texts/006-' + s.title + '.md · built · intake: 20 characters, 3 words · opening /texts/6' : 'Title, tags and body are required.' })
    };
  }
}
</script>
</body>
</html>
