[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chineselearning"
version = "0.1.0"
description = "Rebuildable Chinese learning data bootstrap"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
chineselearning-init = "chineselearning.bootstrap:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

