[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chineselearning"
version = "0.1.0"
description = "Chinese learning and teaching system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
chineselearning = "chineselearning.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]
tools = [
    "pypinyin>=0.53,<1",
]

[tool.uv]
default-groups = ["dev", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
