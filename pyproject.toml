[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chineselearning"
version = "0.1.0"
description = "Rebuildable Chinese learning data bootstrap"
requires-python = ">=3.13,<3.14"
dependencies = ["sqlalchemy>=2.0,<2.1"]

[project.scripts]
chineselearning-init = "chineselearning.bootstrap:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

